name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # Dev-only deps (typescript, @types/node). Runtime stays zero-dependency.
      - name: Install dev dependencies
        run: npm ci

      # Node's type stripping never type-checks; this is the only gate against e.g. undefined identifiers.
      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v7

      # Builds the image, waits for HEALTHCHECK=healthy, curls /healthz, and checks a clean SIGTERM stop.
      - name: Build and smoke test image
        run: ./scripts/docker-smoke.sh "quejugamos:${{ github.sha }}"
