name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      # Dev-only deps (typescript, @types/node). Runtime stays zero-dependency.
      - name: Install dev dependencies
        run: npm ci --ignore-scripts

      # Node's type stripping never type-checks; this is the only gate against e.g. undefined identifiers.
      - name: Type-check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  docker:
    name: Docker build + smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Builds the image, waits for HEALTHCHECK=healthy, curls /healthz, and checks a clean SIGTERM stop.
      - name: Build and smoke test image
        run: ./scripts/docker-smoke.sh "quejugamos:${{ github.sha }}"
