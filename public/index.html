<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameMatch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js" integrity="sha384-w6Gb3fXHb5e1LUYa/hYA5Q41bEDglN5ZPCG7Jvnoo8/X90oGnlPqBlBJCe38mEMm" crossorigin="anonymous"></script>
</head>
<body>
  <header class="topbar">
    <h1 class="logo">Game<span>Match</span> 🎮</h1>
    <div class="topbar-actions" id="topbarActions" hidden>
      <span class="progress" id="progress"></span>
      <button class="btn ghost" id="undoBtn" title="Deshacer (Backspace)">↶ Deshacer</button>
      <button class="btn ghost" id="resultsBtn">🏆 Resultados</button>
      <button class="btn ghost" id="setupBtn">⚙️ Config</button>
    </div>
  </header>

  <!-- SETUP -->
  <main class="screen" id="setupScreen">
    <section class="panel setup">
      <h2>¿Quiénes juegan?</h2>
      <form class="add-player" id="addPlayerForm">
        <input id="playerInput" maxlength="16" placeholder="Nombre del amigo" autocomplete="off">
        <button class="btn primary" type="submit">Agregar</button>
      </form>
      <ul class="player-chips" id="playerChips"></ul>

      <h2>Filtros</h2>
      <div class="filter">
        <label>Plataformas (que esté en al menos una)</label>
        <div class="platform-toggles" id="platformToggles"></div>
      </div>
      <div class="filter">
        <label for="maxPrice">Precio máximo: <strong id="maxPriceLabel"></strong></label>
        <input type="range" id="maxPrice" min="0" max="70" step="5">
      </div>
      <div class="filter">
        <label class="check"><input type="checkbox" id="fitsGroup"> Solo juegos donde entremos todos</label>
      </div>
      <button class="btn primary big" id="startBtn">Empezar a swipear 🔥</button>
      <p class="hint" id="setupHint"></p>
    </section>
  </main>

  <!-- SWIPE -->
  <main class="screen" id="swipeScreen" hidden>
    <article class="card" id="card">
      <div class="stamp like">LIKE</div>
      <div class="stamp nope">NOPE</div>
      <div class="media">
        <video id="video" playsinline muted loop></video>
        <img id="mediaImg" alt="">
        <div class="media-actions">
          <button class="btn round" id="muteBtn" title="Sonido (M)">🔇</button>
        </div>
      </div>
      <div class="shots" id="shots"></div>
    </article>

    <aside class="info panel">
      <div class="title-row">
        <h2 id="gameName"></h2>
        <span class="price" id="gamePrice"></span>
      </div>
      <div class="meta" id="gameMeta"></div>
      <div class="tags" id="gameTags"></div>
      <p class="pitch" id="gamePitch"></p>
      <p class="steam-desc" id="gameSteamDesc"></p>
      <div class="links" id="gameLinks"></div>

      <div class="votes">
        <h3>Votos <small>teclas 1-9 · → siguiente · ← deshacer</small></h3>
        <ul id="voteList"></ul>
        <div class="vote-actions">
          <button class="btn nope-btn" id="allNopeBtn">✕ Nope a todos</button>
          <button class="btn primary" id="nextBtn">Siguiente →</button>
          <button class="btn like-btn" id="allLikeBtn">♥ Like a todos</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- RESULTS -->
  <main class="screen" id="resultsScreen" hidden>
    <section class="panel results">
      <div class="results-head">
        <h2>🏆 Ranking</h2>
        <div>
          <button class="btn ghost" id="backToSwipeBtn">Seguir votando</button>
          <button class="btn danger" id="resetBtn">Reiniciar votación</button>
        </div>
      </div>
      <ol class="ranking" id="ranking"></ol>
    </section>
  </main>

  <div class="loading" id="loading" hidden>
    <div class="spinner"></div>
    <p id="loadingText">Cargando juegos…</p>
  </div>

  <div class="match-overlay" id="matchOverlay" hidden>
    <div class="match-text">IT'S A MATCH 💘</div>
    <p id="matchGame"></p>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
